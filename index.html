<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raket-timern! 🚀</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raket-timer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1a0b4d">
<link rel="apple-touch-icon" href="ikon.png">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    font-family: 'Fredoka', 'Comic Sans MS', sans-serif; color: #fff; text-align: center;
    background: linear-gradient(135deg, #1a0b4d, #5b1a9e, #0b6fb8, #1a0b4d);
    background-size: 400% 400%; animation: bg 15s ease infinite;
  }
  @keyframes bg { 0%{background-position:0 50%} 50%{background-position:100% 50%} 100%{background-position:0 50%} }
  .star { position: fixed; border-radius: 50%; background: #fff; animation: twinkle 2s infinite alternate; }
  @keyframes twinkle { from{opacity:.15} to{opacity:1} }
  main { position: relative; z-index: 2; padding: 20px; }
  h1 { font-family: 'Bangers', 'Comic Sans MS', cursive; font-size: 2.5rem; letter-spacing: 3px; margin: 10px 0; text-shadow: 3px 3px #ff2d95; }
  #time {
    font-family: 'Bangers', 'Comic Sans MS', cursive;
    font-size: clamp(6rem, 28vw, 15rem); line-height: 1; margin: 0;
    background: linear-gradient(180deg, #fff35c, #ff9f1c, #ff2d95);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(5px 5px 0 #000a);
    transition: transform .2s;
  }
  #time.tick { transform: scale(1.06) rotate(-2deg); }
  .unit { font-size: 1.6rem; margin-top: -10px; }
  .controls { margin: 20px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  input { font: inherit; font-size: 1.5rem; width: 130px; padding: 10px; border-radius: 16px; border: 4px solid #ffe14d; text-align: center; }
  button {
    font-family: 'Bangers', cursive; font-size: 1.8rem; letter-spacing: 2px; padding: 10px 24px; color: #fff;
    border: 4px solid #fff; border-radius: 20px; cursor: pointer; box-shadow: 0 6px 0 #0006; transition: transform .1s;
  }
  button:active { transform: translateY(5px); box-shadow: 0 1px 0 #0006; }
  #start { background: #22c55e; } #stop { background: #ef4444; } #set { background: #3b82f6; }
  #bar { width: min(600px, 90vw); height: 26px; margin: 0 auto; background: #0005; border-radius: 20px; border: 3px solid #fff; overflow: hidden; }
  #fill { height: 100%; width: 0; background: repeating-linear-gradient(45deg,#ffe14d,#ffe14d 15px,#ff9f1c 15px,#ff9f1c 30px); transition: width .5s linear; }
  #hero { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 150%); z-index: 5; transition: transform .5s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
  #hero.show { transform: translate(-50%, 0); }
  #hero .emoji { font-size: 8rem; animation: bounce .6s infinite alternate; }
  #hero .msg { font-family: 'Bangers', cursive; font-size: 2.2rem; background: #fff; color: #5b1a9e; padding: 8px 22px; border-radius: 30px; border: 4px solid #ff2d95; display: inline-block; }
  @keyframes bounce { from{transform:translateY(0) rotate(-8deg)} to{transform:translateY(-25px) rotate(8deg)} }
  .confetti { position: fixed; top: -30px; font-size: 2rem; z-index: 4; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<main>
  <h1>🚀 Raket-timern! 🚀</h1>
  <div id="time">60</div>
  <div class="unit">sekunder</div>
  <div class="controls">
    <input id="secs" type="number" min="1" value="60" aria-label="Sekunder">
    <button id="set">STÄLL IN</button>
    <button id="start">START</button>
    <button id="stop">STOPP</button>
  </div>
  <div id="bar"><div id="fill"></div></div>
</main>
<div id="hero"><div class="emoji" id="emoji"></div><div class="msg" id="msg"></div></div>

<script>
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const z = Math.random() * 3 + 1;
    s.style.cssText = `width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;
    document.body.appendChild(s);
  }
  const $ = id => document.getElementById(id);
  let total = 60, left = 60, timer = null, shown = new Set();
  // [procent kvar, figur, text]
  const milestones = [
    [90, '🚀', 'Raketen har lyft!'],
    [75, '🦖', 'Dinosaurien tror på dig!'],
    [50, '🦸', 'Halvvägs, superhjälte!'],
    [25, '🐉', 'Draken hejar på dig!'],
    [10, '🤖', 'Nästan framme, robot-kraft!'],
    [0, '🏆', 'DU KLARADE DET! Mästare!']
  ];
  function render() {
    $('time').textContent = left;
    $('fill').style.width = (total ? (total - left) / total * 100 : 0) + '%';
    $('time').classList.add('tick'); setTimeout(() => $('time').classList.remove('tick'), 150);
  }
  function hero(e, m) {
    $('emoji').textContent = e; $('msg').textContent = m;
    $('hero').classList.add('show');
    setTimeout(() => $('hero').classList.remove('show'), 3000);
  }
  function confetti() {
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div'); c.className = 'confetti';
      c.textContent = ['🎉','⭐','🎈','✨'][i % 4];
      c.style.left = Math.random() * 100 + '%'; c.style.animationDelay = Math.random() + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
    }
  }
  function check() {
    const pct = left / total * 100;
    for (const [p, e, m] of milestones) {
      if (p === 0 ? left === 0 : pct <= p && total >= 10) {
        if (!shown.has(p) && (p === 0 || left > 0)) {
          shown.add(p); hero(e, m); if (p === 0) confetti(); break;
        }
      }
    }
  }
  let ctx;
  function noise(dur) {
    const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = b; return s;
  }
  // Syntetiserat creeper-ljud: sssSSS... BOOM!
  function creeper() {
    if (!ctx) return;
    const t = ctx.currentTime;
    const hiss = noise(1.2), hf = ctx.createBiquadFilter(), hg = ctx.createGain();
    hf.type = 'highpass'; hf.frequency.value = 3000;
    hg.gain.setValueAtTime(0.05, t); hg.gain.linearRampToValueAtTime(0.5, t + 1.1); hg.gain.setValueAtTime(0, t + 1.2);
    hiss.connect(hf).connect(hg).connect(ctx.destination); hiss.start(t);
    const b = t + 1.2;
    const boom = noise(2), lf = ctx.createBiquadFilter(), bg = ctx.createGain();
    lf.type = 'lowpass'; lf.frequency.setValueAtTime(2500, b); lf.frequency.exponentialRampToValueAtTime(80, b + 1.8);
    bg.gain.setValueAtTime(1.5, b); bg.gain.exponentialRampToValueAtTime(0.001, b + 1.9);
    boom.connect(lf).connect(bg).connect(ctx.destination); boom.start(b);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, b); o.frequency.exponentialRampToValueAtTime(30, b + 1);
    og.gain.setValueAtTime(1.2, b); og.gain.exponentialRampToValueAtTime(0.001, b + 1.2);
    o.connect(og).connect(ctx.destination); o.start(b); o.stop(b + 1.3);
  }
  function stop() { clearInterval(timer); timer = null; }
  function start() {
    if (timer || left <= 0) return;
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    timer = setInterval(() => { left--; render(); check(); if (left <= 0) { stop(); creeper(); } }, 1000);
  }
  function setTime() {
    stop(); total = left = Math.max(1, parseInt($('secs').value) || 1);
    shown = new Set(); render();
  }
  $('set').onclick = setTime;
  $('start').onclick = start;
  $('stop').onclick = stop;
  $('secs').addEventListener('keydown', e => { if (e.key === 'Enter') setTime(); });
  render();
</script>
</body>
</html>
